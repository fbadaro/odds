<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Montserrat:wght@700;800&display=swap">
  <style>
    :root {
      --c-bg: 250 250 254; --c-panel: 255 255 255; --c-panel2: 244 243 250;
      --c-border: 230 228 242; --c-ink: 27 26 36; --c-dim: 107 104 128;
      --c-accent: 108 64 217; --c-azure: 61 111 232; --c-pulse: 35 168 205; --c-solar: 255 197 61;
      --c-error: 192 52 43; --c-warning: 166 106 0; --c-info: 91 107 124;
    }
    body { margin: 0; font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: rgb(var(--c-accent)); } a:hover { color: rgb(var(--c-azure)); }
    .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
    .cap { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .2em; color: rgb(var(--c-dim)); }
    .plane { position: absolute; left: 50%; bottom: -70px; width: 1200px; height: 340px; transform: translateX(-50%) perspective(520px) rotateX(66deg); transform-origin: 50% 100%;
      background-image: linear-gradient(rgb(var(--c-accent) / .14) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--c-accent) / .14) 1px, transparent 1px);
      background-size: 58px 58px; -webkit-mask-image: linear-gradient(to top, #000 4%, transparent 60%); mask-image: linear-gradient(to top, #000 4%, transparent 60%); }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }

    /* ---- ciclo de 12s: cada elemento tem a MESMA duração e difere só nas porcentagens ---- */
    .A { animation-duration: 12s; animation-timing-function: linear; animation-iteration-count: infinite; }
    @keyframes t1 { 0%,3%{transform:scaleX(0)} 9%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    @keyframes t2 { 0%,11%{transform:scaleX(0)} 17%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    @keyframes t3 { 0%,19%{transform:scaleX(0)} 25%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    @keyframes t4 { 0%,27%{transform:scaleX(0)} 33%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    @keyframes t5 { 0%,35%{transform:scaleX(0)} 42%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    @keyframes t6 { 0%,44%{transform:scaleX(0)} 50%,92%{transform:scaleX(1)} 96%,100%{transform:scaleX(0)} }
    @keyframes nA { 0%,14%{opacity:0;transform:translateY(6px) scale(.94)} 19%,92%{opacity:1;transform:none} 97%,100%{opacity:0;transform:translateY(6px) scale(.94)} }
    @keyframes nB { 0%,22%{opacity:0;transform:translateY(6px) scale(.94)} 27%,92%{opacity:1;transform:none} 97%,100%{opacity:0;transform:translateY(6px) scale(.94)} }
    @keyframes nC { 0%,30%{opacity:0;transform:translateY(6px) scale(.94)} 35%,92%{opacity:1;transform:none} 97%,100%{opacity:0;transform:translateY(6px) scale(.94)} }
    @keyframes e1 { 0%,45%{stroke-dashoffset:200} 53%,92%{stroke-dashoffset:0} 97%,100%{stroke-dashoffset:200} }
    @keyframes e2 { 0%,50%{stroke-dashoffset:200} 58%,92%{stroke-dashoffset:0} 97%,100%{stroke-dashoffset:200} }
    @keyframes mk { 0%,62%{opacity:0;transform:scale(.5)} 67%,92%{opacity:1;transform:scale(1)} 96%,100%{opacity:0;transform:scale(.5)} }
    @keyframes lineWarn { 0%,62%{opacity:0} 67%,92%{opacity:1} 96%,100%{opacity:0} }
    @keyframes ring2 { 0%,63%{opacity:0;transform:scale(.75)} 70%{opacity:.5;transform:scale(1.05)} 80%,100%{opacity:0;transform:scale(1.5)} }
    @keyframes caret { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes ants { to { stroke-dashoffset: -22; } }
    .type { transform-origin: left center; }
    .caret { animation: caret 1s steps(1) infinite; }
    .ants { animation: ants 1.1s linear infinite; }
    .ring2 { transform-origin: 470px 96px; }
    @media (prefers-reduced-motion: reduce) {
      .A, .caret, .ants { animation: none !important; }
      .type { transform: scaleX(1) !important; }
      [class*="nA"], [class*="nB"], [class*="nC"] { opacity: 1 !important; transform: none !important; }
    }
  </style>
</helmet>

<div style="width: 760px; height: 560px; background: rgb(var(--c-bg)); position: relative; overflow: hidden;">
  <div class="blob" style="left: -120px; top: -110px; width: 22rem; height: 22rem; opacity: .4; background: radial-gradient(circle, #D9C8FF, transparent 66%);"></div>
  <div class="blob" style="right: -140px; top: 180px; width: 20rem; height: 20rem; opacity: .28; background: radial-gradient(circle, #C3E9F5, transparent 66%);"></div>
  <div class="plane"></div>

  <div style="position: absolute; left: 26px; top: 22px; display: flex; align-items: center; gap: 9px;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--c-accent));"></span>
    <span class="cap">A · o texto vira mapa</span>
  </div>

  <svg width="760" height="470" viewBox="0 0 760 470" fill="none" style="position: absolute; left: 0; top: 62px;" role="img" aria-label="O texto é digitado e o mapa aparece junto; ao final um aviso marca uma das relações">
    <defs>
      <linearGradient id="ge" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6C40D9"/><stop offset="100%" stop-color="#3D6FE8"/></linearGradient>
      <radialGradient id="gglow"><stop offset="0%" stop-color="#6C40D9" stop-opacity=".12"/><stop offset="100%" stop-color="#6C40D9" stop-opacity="0"/></radialGradient>
      <clipPath id="c1"><rect x="0" y="0" width="250" height="16" class="type A" style="animation-name: t1"/></clipPath>
      <clipPath id="c2"><rect x="0" y="0" width="250" height="16" class="type A" style="animation-name: t2"/></clipPath>
      <clipPath id="c3"><rect x="0" y="0" width="250" height="16" class="type A" style="animation-name: t3"/></clipPath>
      <clipPath id="c4"><rect x="0" y="0" width="250" height="16" class="type A" style="animation-name: t4"/></clipPath>
      <clipPath id="c5"><rect x="0" y="0" width="250" height="16" class="type A" style="animation-name: t5"/></clipPath>
      <clipPath id="c6"><rect x="0" y="0" width="250" height="16" class="type A" style="animation-name: t6"/></clipPath>
    </defs>

    <circle cx="520" cy="200" r="180" fill="url(#gglow)"/>

    <!-- painel de código -->
    <g>
      <rect x="26" y="42" width="268" height="196" rx="16" fill="#FFFFFF" stroke="rgb(230 228 242)"/>
      <rect x="26" y="42" width="268" height="30" rx="16" fill="rgb(244 243 250)" opacity=".7"/>
      <rect x="26" y="60" width="268" height="12" fill="rgb(244 243 250)" opacity=".7"/>
      <line x1="26" y1="72" x2="294" y2="72" stroke="rgb(230 228 242)"/>
      <circle cx="42" cy="57" r="3.5" fill="rgb(230 228 242)"/>
      <text x="54" y="61" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(107 104 128)">vendas.odds</text>

      <g font-family="JetBrains Mono, monospace" font-size="10.5">
        <g clip-path="url(#c1)" transform="translate(42 92)"><text x="0" y="0" fill="rgb(108 64 217)">domain <tspan fill="rgb(27 26 36)">Vendas</tspan> <tspan fill="rgb(180 178 196)">{</tspan></text></g>
        <g clip-path="url(#c2)" transform="translate(42 112)"><text x="0" y="0" fill="rgb(108 64 217)">  subdomain core <tspan fill="rgb(27 26 36)">Checkout</tspan> <tspan fill="rgb(180 178 196)">{</tspan></text></g>
        <g clip-path="url(#c3)" transform="translate(42 132)"><text x="0" y="0" fill="rgb(108 64 217)">    context <tspan fill="rgb(27 26 36)">Pagamento</tspan></text></g>
        <g clip-path="url(#c4)" transform="translate(42 152)"><text x="0" y="0" fill="rgb(108 64 217)">  external <tspan fill="rgb(180 178 196)">{</tspan> <tspan fill="rgb(108 64 217)">context</tspan> <tspan fill="rgb(27 26 36)">ERP</tspan> <tspan fill="rgb(180 178 196)">}</tspan></text></g>
        <g clip-path="url(#c5)" transform="translate(42 172)"><text x="0" y="0" fill="rgb(108 64 217)">  mapping <tspan fill="rgb(180 178 196)">{</tspan></text></g>
        <g clip-path="url(#c6)" transform="translate(42 192)"><text x="0" y="0" fill="rgb(27 26 36)">    Pagamento <tspan fill="rgb(107 104 128)">[CF]</tspan> &lt;-- ERP</text></g>
      </g>

      <!-- linha marcada quando o veredito chega -->
      <g class="A" style="animation-name: lineWarn">
        <rect x="34" y="180" width="252" height="18" rx="5" fill="rgb(166 106 0)" opacity=".09"/>
        <rect x="34" y="180" width="2.5" height="18" rx="1.2" fill="rgb(166 106 0)"/>
      </g>

      <rect class="caret" x="44" y="206" width="6" height="12" fill="rgb(108 64 217)"/>
    </g>

    <!-- mapa -->
    <g transform="translate(346 0)">
      <path class="A ants" d="M96 96 H 216" stroke="url(#ge)" stroke-width="2" stroke-linecap="round" stroke-dasharray="200" style="animation-name: e1, ants; animation-duration: 12s, 1.1s; animation-iteration-count: infinite, infinite; animation-timing-function: linear, linear;"/>
      <path class="A" d="M56 122 V 196 H 148" stroke="url(#ge)" stroke-width="2" stroke-linecap="round" stroke-dasharray="200" style="animation-name: e2"/>

      <g class="A" style="animation-name: nA; transform-origin: 66px 96px;">
        <rect x="8" y="74" width="112" height="44" rx="10" fill="rgb(108 64 217)" fill-opacity=".07" stroke="rgb(108 64 217)" stroke-width="1.2"/>
        <text x="64" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(27 26 36)">Pagamento</text>
        <text x="64" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(107 104 128)">core</text>
      </g>
      <g class="A" style="animation-name: nB; transform-origin: 272px 96px;">
        <rect x="216" y="74" width="112" height="44" rx="10" fill="rgb(61 111 232)" fill-opacity=".07" stroke="rgb(61 111 232)" stroke-width="1.2"/>
        <text x="272" y="94" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(27 26 36)">ERP</text>
        <text x="272" y="107" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(107 104 128)">external</text>
      </g>
      <g class="A" style="animation-name: nC; transform-origin: 204px 196px;">
        <rect x="148" y="174" width="112" height="44" rx="10" fill="rgb(35 168 205)" fill-opacity=".08" stroke="rgb(35 168 205)" stroke-width="1.2"/>
        <text x="204" y="194" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(27 26 36)">Carrinho</text>
        <text x="204" y="207" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(107 104 128)">core</text>
      </g>

      <circle class="A ring2" cx="124" cy="96" r="14" fill="none" stroke="rgb(166 106 0)" stroke-width="2" style="animation-name: ring2; transform-origin: 124px 96px;"/>
      <g class="A" style="animation-name: mk; transform-origin: 124px 96px;">
        <circle cx="124" cy="96" r="13" fill="#FFFFFF" stroke="rgb(166 106 0)" stroke-width="2"/>
        <path d="M124 90 l5.6 10.5 h-11.2 z" fill="rgb(166 106 0)"/>
      </g>
      <g class="A" style="animation-name: mk;">
        <rect x="48" y="238" width="230" height="26" rx="8" fill="#FFFFFF" stroke="rgb(166 106 0)" stroke-opacity=".35"/>
        <rect x="58" y="246" width="88" height="11" rx="3" fill="rgb(166 106 0)" fill-opacity=".16"/>
        <text x="62" y="255" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(122 78 0)">CONFORMIST_CORE</text>
        <text x="156" y="255" font-family="Inter, sans-serif" font-size="9.5" fill="rgb(107 104 128)">core se conformando</text>
      </g>
    </g>
  </svg>
</div>
</x-dc>
</body>
</html>
