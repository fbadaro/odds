<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --c-bg: 250 250 254; --c-panel: 255 255 255; --c-panel2: 244 243 250;
      --c-border: 230 228 242; --c-ink: 27 26 36; --c-dim: 107 104 128;
      --c-accent: 108 64 217; --c-azure: 61 111 232; --c-pulse: 35 168 205; --c-solar: 255 197 61;
      --c-error: 192 52 43; --c-warning: 166 106 0; --c-info: 91 107 124;
    }
    body { margin: 0; font-family: "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: rgb(var(--c-accent)); } a:hover { color: rgb(var(--c-azure)); }
    .cap { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 11px; text-transform: uppercase; letter-spacing: .2em; color: rgb(var(--c-dim)); }
    .plane { position: absolute; left: 50%; bottom: -70px; width: 1200px; height: 340px; transform: translateX(-50%) perspective(520px) rotateX(66deg); transform-origin: 50% 100%;
      background-image: linear-gradient(rgb(var(--c-accent) / .14) 1px, transparent 1px), linear-gradient(90deg, rgb(var(--c-accent) / .14) 1px, transparent 1px);
      background-size: 58px 58px; -webkit-mask-image: linear-gradient(to top, #000 4%, transparent 60%); mask-image: linear-gradient(to top, #000 4%, transparent 60%); }
    .blob { position: absolute; border-radius: 50%; filter: blur(70px); pointer-events: none; }

    .B { animation-duration: 11s; animation-timing-function: linear; animation-iteration-count: infinite; }
    /* a varredura atravessa duas vezes por ciclo, com pausa entre elas */
    @keyframes sweep { 0%{transform:translateX(-120px);opacity:0} 4%{opacity:.9} 40%{opacity:.9} 46%{transform:translateX(430px);opacity:0} 100%{transform:translateX(430px);opacity:0} }
    @keyframes d1 { 0%,13%{opacity:0;transform:translateY(5px) scale(.85)} 17%,88%{opacity:1;transform:none} 94%,100%{opacity:0;transform:translateY(5px) scale(.85)} }
    @keyframes d2 { 0%,23%{opacity:0;transform:translateY(5px) scale(.85)} 27%,88%{opacity:1;transform:none} 94%,100%{opacity:0;transform:translateY(5px) scale(.85)} }
    @keyframes d3 { 0%,33%{opacity:0;transform:translateY(5px) scale(.85)} 37%,88%{opacity:1;transform:none} 94%,100%{opacity:0;transform:translateY(5px) scale(.85)} }
    /* contador: um grupo de dígitos empilhados que sobe em degraus */
    @keyframes count { 0%,13%{transform:translateY(0)} 17%,23%{transform:translateY(-18px)} 27%,33%{transform:translateY(-36px)} 37%,88%{transform:translateY(-54px)} 94%,100%{transform:translateY(0)} }
    @keyframes markPulse { 0%,36%{opacity:0;transform:scale(.6)} 40%,88%{opacity:1;transform:scale(1)} 94%,100%{opacity:0;transform:scale(.6)} }
    @keyframes ringB { 0%,38%{opacity:0;transform:scale(.8)} 46%{opacity:.5;transform:scale(1.1)} 58%,100%{opacity:0;transform:scale(1.6)} }
    @keyframes edgeWarn { 0%,36%{stroke:rgb(61 111 232);stroke-dasharray:0 0} 40%,88%{stroke:rgb(166 106 0);stroke-dasharray:6 5} 94%,100%{stroke:rgb(61 111 232);stroke-dasharray:0 0} }
    @keyframes ants { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) {
      .B, .ants { animation: none !important; }
      [style*="animation-name: d1"], [style*="animation-name: d2"], [style*="animation-name: d3"], [style*="animation-name: markPulse"] { opacity: 1 !important; transform: none !important; }
    }
  </style>
</helmet>

<div style="width: 760px; height: 560px; background: rgb(var(--c-bg)); position: relative; overflow: hidden;">
  <div class="blob" style="left: -120px; top: -110px; width: 22rem; height: 22rem; opacity: .4; background: radial-gradient(circle, #D9C8FF, transparent 66%);"></div>
  <div class="blob" style="right: -150px; top: 200px; width: 20rem; height: 20rem; opacity: .26; background: radial-gradient(circle, #FFE08A, transparent 66%);"></div>
  <div class="plane"></div>

  <div style="position: absolute; left: 26px; top: 22px; display: flex; align-items: center; gap: 9px;">
    <span style="width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--c-warning));"></span>
    <span class="cap">B · a varredura</span>
  </div>

  <svg width="760" height="470" viewBox="0 0 760 470" fill="none" style="position: absolute; left: 0; top: 62px;" role="img" aria-label="Uma varredura passa pelo mapa e os diagnósticos aparecem um a um, com o contador subindo">
    <defs>
      <linearGradient id="gsweep" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#6C40D9" stop-opacity="0"/>
        <stop offset="45%" stop-color="#6C40D9" stop-opacity=".16"/>
        <stop offset="52%" stop-color="#6C40D9" stop-opacity=".5"/>
        <stop offset="58%" stop-color="#6C40D9" stop-opacity=".16"/>
        <stop offset="100%" stop-color="#6C40D9" stop-opacity="0"/>
      </linearGradient>
      <radialGradient id="gglow2"><stop offset="0%" stop-color="#6C40D9" stop-opacity=".1"/><stop offset="100%" stop-color="#6C40D9" stop-opacity="0"/></radialGradient>
      <clipPath id="board"><rect x="150" y="40" width="430" height="290" rx="18"/></clipPath>
    </defs>

    <circle cx="380" cy="180" r="200" fill="url(#gglow2)"/>

    <!-- a prancheta com o mapa já pronto -->
    <rect x="150" y="40" width="430" height="290" rx="18" fill="#FFFFFF" fill-opacity=".72" stroke="rgb(230 228 242)"/>

    <g clip-path="url(#board)">
      <!-- arestas -->
      <path d="M246 128 H 402" stroke="rgb(61 111 232)" stroke-width="1.8" stroke-linecap="round" opacity=".65"/>
      <path d="M212 154 V 228 H 300" stroke="rgb(61 111 232)" stroke-width="1.8" stroke-linecap="round" opacity=".65"/>
      <path class="B" d="M470 154 V 254 H 412" stroke-width="1.8" stroke-linecap="round" fill="none" style="animation-name: edgeWarn"/>

      <!-- nós -->
      <g>
        <rect x="164" y="106" width="112" height="44" rx="10" fill="rgb(108 64 217)" fill-opacity=".07" stroke="rgb(108 64 217)" stroke-width="1.2"/>
        <text x="220" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(27 26 36)">Pagamento</text>
        <text x="220" y="139" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(107 104 128)">core</text>
      </g>
      <g>
        <rect x="402" y="106" width="112" height="44" rx="10" fill="rgb(61 111 232)" fill-opacity=".07" stroke="rgb(61 111 232)" stroke-width="1.2"/>
        <text x="458" y="126" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(27 26 36)">ERP</text>
        <text x="458" y="139" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(107 104 128)">external</text>
      </g>
      <g>
        <rect x="300" y="206" width="112" height="44" rx="10" fill="rgb(35 168 205)" fill-opacity=".08" stroke="rgb(35 168 205)" stroke-width="1.2"/>
        <text x="356" y="226" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="10" fill="rgb(27 26 36)">Carrinho</text>
        <text x="356" y="239" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="8" fill="rgb(107 104 128)">core</text>
      </g>

      <!-- a varredura -->
      <rect class="B" x="150" y="40" width="120" height="290" fill="url(#gsweep)" style="animation-name: sweep"/>
    </g>

    <!-- diagnósticos que acendem na passagem -->
    <g class="B" style="animation-name: d1; transform-origin: 300px 90px;">
      <rect x="196" y="76" width="196" height="26" rx="8" fill="#FFFFFF" stroke="rgb(91 107 124)" stroke-opacity=".3"/>
      <circle cx="210" cy="89" r="4" fill="rgb(91 107 124)"/>
      <text x="222" y="93" font-family="JetBrains Mono, monospace" font-size="8.5" fill="rgb(71 85 95)">UNDOCUMENTED_CONTRACT</text>
    </g>
    <g class="B" style="animation-name: d2; transform-origin: 560px 190px;">
      <rect x="452" y="176" width="176" height="26" rx="8" fill="#FFFFFF" stroke="rgb(166 106 0)" stroke-opacity=".35"/>
      <circle cx="466" cy="189" r="4" fill="rgb(166 106 0)"/>
      <text x="478" y="193" font-family="JetBrains Mono, monospace" font-size="8.5" fill="rgb(122 78 0)">CONFORMIST_CORE</text>
    </g>
    <g class="B" style="animation-name: d3; transform-origin: 250px 290px;">
      <rect x="152" y="276" width="166" height="26" rx="8" fill="#FFFFFF" stroke="rgb(91 107 124)" stroke-opacity=".3"/>
      <circle cx="166" cy="289" r="4" fill="rgb(91 107 124)"/>
      <text x="178" y="293" font-family="JetBrains Mono, monospace" font-size="8.5" fill="rgb(71 85 95)">UNMAPPED_CONTEXT</text>
    </g>

    <!-- marcador na relação que virou aviso -->
    <circle class="B" cx="470" cy="128" r="14" fill="none" stroke="rgb(166 106 0)" stroke-width="2" style="animation-name: ringB; transform-origin: 470px 128px;"/>
    <g class="B" style="animation-name: markPulse; transform-origin: 470px 128px;">
      <circle cx="470" cy="128" r="13" fill="#FFFFFF" stroke="rgb(166 106 0)" stroke-width="2"/>
      <path d="M470 122 l5.6 10.5 h-11.2 z" fill="rgb(166 106 0)"/>
    </g>

    <!-- barra de contadores, com o número subindo em degraus -->
    <g transform="translate(240 360)">
      <rect x="0" y="0" width="280" height="40" rx="20" fill="#FFFFFF" stroke="rgb(230 228 242)"/>
      <g transform="translate(16 12)">
        <rect x="0" y="0" width="34" height="16" rx="8" fill="rgb(192 52 43)" fill-opacity=".1"/>
        <circle cx="9" cy="8" r="3" fill="rgb(192 52 43)"/>
        <text x="18" y="11.5" font-family="JetBrains Mono, monospace" font-size="9" fill="rgb(147 39 31)">0</text>
      </g>
      <g transform="translate(58 12)">
        <rect x="0" y="0" width="34" height="16" rx="8" fill="rgb(166 106 0)" fill-opacity=".12"/>
        <circle cx="9" cy="8" r="3" fill="rgb(166 106 0)"/>
        <g clip-path="none"><text x="18" y="11.5" font-family="JetBrains Mono, monospace" font-size="9" fill="rgb(122 78 0)">1</text></g>
      </g>
      <g transform="translate(100 12)">
        <rect x="0" y="0" width="34" height="16" rx="8" fill="rgb(91 107 124)" fill-opacity=".14"/>
        <circle cx="9" cy="8" r="3" fill="rgb(91 107 124)"/>
        <text x="18" y="11.5" font-family="JetBrains Mono, monospace" font-size="9" fill="rgb(71 85 95)">2</text>
      </g>
      <line x1="146" y1="12" x2="146" y2="28" stroke="rgb(230 228 242)"/>
      <g transform="translate(158 12)">
        <clipPath id="clipCount"><rect x="0" y="0" width="14" height="16"/></clipPath>
        <g clip-path="url(#clipCount)">
          <g class="B" style="animation-name: count">
            <text x="0" y="12" font-family="JetBrains Mono, monospace" font-size="11" fill="rgb(27 26 36)">0</text>
            <text x="0" y="30" font-family="JetBrains Mono, monospace" font-size="11" fill="rgb(27 26 36)">1</text>
            <text x="0" y="48" font-family="JetBrains Mono, monospace" font-size="11" fill="rgb(27 26 36)">2</text>
            <text x="0" y="66" font-family="JetBrains Mono, monospace" font-size="11" fill="rgb(27 26 36)">3</text>
          </g>
        </g>
        <text x="18" y="12" font-family="Inter, sans-serif" font-size="10.5" fill="rgb(107 104 128)">diagnósticos neste mapa</text>
      </g>
    </g>
  </svg>
</div>
</x-dc>
</body>
</html>
