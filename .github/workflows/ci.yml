# Every push and PR runs the gates a pass closes on (AGENTS.md); a push to main also
# publishes the playground on GitHub Pages.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # arm64, like the machine that captured the @odds/layout goldens: the layout reads the
    # last bit of Math.sin/cos/atan2/log, which V8 computes differently on x64
    runs-on: macos-latest
    steps:
      # C17 compares against main, so the history has to be there
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:spec
      # served from https://<owner>.github.io/<repo>/
      - run: npm run build:app -- --base=/${{ github.event.repository.name }}/
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/playground/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
